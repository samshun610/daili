<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>示例官网首页</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* 全局基础样式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
            color: #333;
            background-color: #f7f9fc;
            line-height: 1.6;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* 顶部导航 */
        header {
            background: #ffffff;
            border-bottom: 1px solid #e5e9f2;
        }

        .nav {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 22px;
            font-weight: 600;
            color: #1a73e8;
        }

        .nav ul {
            list-style: none;
            display: flex;
            gap: 30px;
            font-size: 15px;
        }

        .nav ul li:hover {
            color: #1a73e8;
        }

        /* 首屏 Banner */
        .hero {
            background: linear-gradient(135deg, #1a73e8, #4f9dff);
            color: #fff;
            padding: 100px 30px;
        }

        .hero-inner {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .hero h1 {
            font-size: 42px;
            font-weight: 700;
        }

        .hero p {
            font-size: 18px;
            max-width: 600px;
            opacity: 0.95;
        }

        .hero .btn {
            margin-top: 20px;
            display: inline-block;
            background: #ffffff;
            color: #1a73e8;
            padding: 14px 32px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 600;
            width: fit-content;
            transition: 0.3s;
        }

        .hero .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
        }

        /* 内容区块 */
        section {
            padding: 80px 30px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .section-title {
            text-align: center;
            margin-bottom: 60px;
        }

        .section-title h2 {
            font-size: 32px;
            margin-bottom: 12px;
        }

        .section-title p {
            color: #666;
            font-size: 16px;
        }

        /* 功能卡片 */
        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 30px;
        }

        .feature-card {
            background: #fff;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.06);
            transition: 0.3s;
        }

        .feature-card:hover {
            transform: translateY(-6px);
        }

        .feature-card h3 {
            font-size: 20px;
            margin-bottom: 12px;
            color: #1a73e8;
        }

        .feature-card p {
            font-size: 15px;
            color: #555;
        }

        /* 底部 */
        footer {
            background: #ffffff;
            border-top: 1px solid #e5e9f2;
            padding: 30px;
        }

        .footer-inner {
            max-width: 1200px;
            margin: 0 auto;
            text-align: center;
            font-size: 14px;
            color: #777;
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .hero h1 {
                font-size: 32px;
            }

            .nav ul {
                gap: 16px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>

<header>
    <nav class="nav">
        <div class="logo">YourBrand</div>
        <ul>
            <li><a href="#">首页</a></li>
            <li><a href="#">服务</a></li>
            <li><a href="#">案例</a></li>
            <li><a href="#">关于我们</a></li>
            <li><a href="#">联系</a></li>
        </ul>
    </nav>
</header>

<section class="hero">
    <div class="hero-inner">
        <h1>打造专业、可靠的数字化解决方案</h1>
        <p>
            我们专注于高质量的网站设计与品牌展示，帮助企业建立可信赖的线上形象。
        </p>
        <a href="#" class="btn">立即了解</a>
    </div>
</section>

<section>
    <div class="container">
        <div class="section-title">
            <h2>我们的优势</h2>
            <p>以专业设计与技术实力，助力品牌成长</p>
        </div>

        <div class="features">
            <div class="feature-card">
                <h3>专业设计</h3>
                <p>遵循现代设计规范，界面简洁大方，提升品牌专业度与信任感。</p>
            </div>

            <div class="feature-card">
                <h3>响应式布局</h3>
                <p>完美适配手机、平板与桌面设备，提供一致的用户体验。</p>
            </div>

            <div class="feature-card">
                <h3>高性能体验</h3>
                <p>结构清晰、加载快速，为用户提供顺畅稳定的访问体验。</p>
            </div>
        </div>
    </div>
</section>

<footer>
    <div class="footer-inner">
        © 2025 YourBrand · 保留所有权利
    </div>
</footer>

</body>
</html>
